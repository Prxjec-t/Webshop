<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍩</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kimi Leminaho" />
    <meta
      name="description"
      content="A webshop for a limited supply of items from the game franchise Fallout"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>New Vegas Store</title>
  </head>
  <body>
    <header>
      <a href="#top">
        <h1>New Vegas Store</h1>
      </a>
      <button id="toggleCartBtn">View cart</button>
    </header>

    <main>
      <div class="cartWrapper" id="cartWrapper" class="hidden">
        <section>
          <div class="cart">
            <h2>Cart</h2>
            <p class="cart-total" id="cartTotal"></p>
            <p id="shippingCost"></p>
            <div id="mondayDiscountText" class="hidden">
              Monday Discount: 10 % on the whole order.
            </div>

            <div id="cart">Cart is empty.</div>
            <div class="cart-actions">
              <button id="resetCartBtn" class="reset-button">Reset Cart</button>
              <button id="checkoutBtn" class="checkout-button">
                Proceed to Checkout
              </button>
            </div>
            <div class="statusMessage hidden" id="statusMessage">
              Cart was reset because user took to long.
            </div>
          </div>
        </section>
      </div>

      <div class="filter">
        Filter:
        <button id="drinkFilterBtn">Drinks</button>
        <button id="foodFilterBtn">Food</button>
        <button id="chemsFilterBtn">Chems</button>
        <button id="showAllFilterBtn">Show all</button>
      </div>

      <div class="sort">
        Sort:
        <button id="sortByNameBtn">Name (A-Z)</button>
        <button id="sortByPriceBtn">Price (High to Low)</button>
        <button id="sortByLowPriceBtn">Price (Low to High)</button>
      </div>

      <div class="products-container">
        <section class="products-list" id="products"></section>
      </div>

      <form class="form-container hidden" id="orderForm">
        <button type="button" id="closeFormBtn" class="close-btn">
          &times;
        </button>

        <h2>Shipping Details</h2>

        <label>
          <span class="required">First Name</span>
          <input
            type="text"
            id="firstname"
            name="firstName"
            autocomplete="given-name"
            required
          />
          <span class="hidden error"
            >Error: First name needs to be at least 2 characters long.</span
          >
        </label>

        <label>
          <span>Last Name</span>
          <input
            type="text"
            id="lastname"
            name="lastName"
            autocomplete="family-name"
            required
          />
          <span class="hidden error"
            >Error: Last name needs to be at least 2 characters long.</span
          >
        </label>

        <label>
          <span>Adress</span>
          <input
            type="text"
            id="adress"
            name="adress"
            autocomplete="street-address"
            required
          />
          <span class="hidden error">Error: Please enter valid address.</span>
        </label>

        <label>
          <span>Postal Code</span>
          <input
            type="text"
            id="postalcode"
            name="postalcode"
            autocomplete="postal-code"
            required
          />
          <span class="hidden error"
            >Error: Please enter a valid postal code.</span
          >
        </label>

        <label>
          <span>City</span>
          <input
            type="text"
            id="city"
            name="city"
            autocomplete="address-level2"
            required
          />
          <span class="hidden error">Error: Please enter a valid city.</span>
        </label>

        <label>
          <span>Email</span>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
          <span class="hidden error"
            >Error: Please enter a valid email address.</span
          >
        </label>

        <label>
          <span>Phone number</span>
          <input
            type="tel"
            id="phone"
            name="phone"
            autocomplete="tel"
            required
          />
          <span class="hidden error"
            >Error: Please enter a valid phone number.</span
          >
        </label>

        <div class="invoiceOrCard">
          <input type="radio" name="invoiceOrCard" value="invoice" />
          <input type="radio" name="invoiceOrCard" value="card" />
        </div>

        <div class="cardPayment hidden" id="cardPayment">
          <label>
            <span>Card number</span>
            <input type="number" name="cardNumber" id="cardNumber" />
          </label>

          <label>
            <span>YY</span>
            <input type="number" name="year" id="year" />
          </label>

          <label>
            <span>MM</span>
            <input type="number" name="month" id="month" />
          </label>

          <label>
            <span>Security code</span>
            <input type="number" name="securityCode" id="securityCode" />
          </label>
        </div>

        <div class="invoicePayment hidden" id="invoicePayment">
          <label>
            Social Security No:
            <input type="text" id="ssn" placeholder="YYYYMMDD-XXXX" />
            <span class="hidden error">Error: Use format YYYMMDD-XXXX</span>
          </label>
        </div>

        <label
          >Discount Code:
          <input type="text" id="discountCode" />
        </label>

        <label>
          <input type="checkbox" id="gdpr" required /> I agree to the processing
          of personal data.
        </label>

        <label>
          <input type="checkbox" id="newsletter" checked /> Subscribe to the New
          Vegas Store Newsletter.
        </label>

        <div id="form-error-summary" class="hidden error-text"></div>
        <button class="orderBtn" id="orderBtn" disabled>Order</button>
        <button type="button" id="clearFormBtn">Clear Order</button>
      </form>
    </main>

    <footer>&copy; Kimi Leminaho</footer>
    <div id="notification-toast" class="hidden toast"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
